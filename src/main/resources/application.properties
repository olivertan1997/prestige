# Everything below is for conencting database
spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/prestigedb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=user

# Automatically update your database tables to match your Java @Entity models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# The one company that "Interior Design Company Information Management" (about.html /
# contact.html) shows and edits, since there is no login system yet to know which designer's
# own company it should be. 1 = "Rahman Interior Design" (designer 6). Change this to manage
# a different company; once logins exist this should come from the signed-in designer instead.
app.company.id=1

# Isolated Favourite/Admin demo-session hardening. Enable cookie.secure=true under HTTPS in production.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

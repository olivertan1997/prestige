<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Reports | PRESTIGE Administration</title>
<style>
:root{--paper:#f7f5f0;--ink:#252521;--gold:#b18c5b;--line:#e5e0d7;--muted:#77736c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Arial,sans-serif}
header{background:#20211e;color:white;padding:20px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px}
header a{color:#f4f0e6;text-decoration:none}header strong{letter-spacing:3px}
main{margin:50px auto;max-width:1150px;padding:0 24px;min-height:65vh}h1{font:normal clamp(34px,5vw,52px) Georgia,serif;margin:0 0 10px}
.subtitle{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0}
select,button{padding:10px 14px;border:1px solid #cbb99e;background:#fff;color:var(--ink);font-size:13px}
button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:14px;vertical-align:top}
th{background:#efeae1;color:#71634f;text-transform:uppercase;font-size:10px;letter-spacing:1px}
.issue-title{font-weight:700}.issue-description{color:var(--muted);max-width:400px;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{display:inline-block;padding:4px 9px;background:#eee6d9;font-size:11px}.tag.done{background:#e5efe6;color:#285c30}
#message{min-height:24px;color:#765534}.pagination{display:flex;align-items:center;gap:14px;margin-top:22px}
footer{background:#20211e;color:#bbb;padding:25px;text-align:center}
</style></head><body>
<header><a href="home.html"><strong>PRESTIGE</strong> / Administration</a><nav><a href="portfolio.html">Public site</a></nav></header>
<main><h1>Reported issues.</h1>
<p class="subtitle">Review incoming reports and record a resolution. Only User Admin accounts may access the data.</p>
<div class="toolbar"><label for="status">Status</label><select id="status"><option value="ALL">All reports</option><option value="OPEN">Open</option><option value="RECTIFIED">Rectified</option></select>
<button id="refresh">Refresh</button><span id="count"></span></div>
<p id="message" role="status" aria-live="polite">Checking access…</p>
<div class="table-wrap"><table><thead><tr><th>ID / Date</th><th>Reporter</th><th>Issue / Description</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><button id="previous">Previous</button><span id="pageLabel"></span><button id="next">Next</button></div></main>
<footer>© 2026 PRESTIGE Interior Design · Administration</footer>
<script src="feature-client.js"></script><script>
const rows=document.getElementById('rows'),message=document.getElementById('message'),
      count=document.getElementById('count'),pageLabel=document.getElementById('pageLabel');
let account=null,page=0,totalPages=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;}
function cell(row,children){const td=el('td');for(const child of children)td.append(child);row.append(td);return td;}
function timestamp(x){return x?new Date(x+'Z').toLocaleString('en-SG',{timeZone:'Asia/Singapore',dateStyle:'medium',timeStyle:'short'}):'—';}
function showReport(r){
  const tr=el('tr');cell(tr,[el('strong','#'+r.id),el('div',timestamp(r.createdAt))]);
  cell(tr,[el('strong',r.reporterName),el('div','User ID: '+r.reporterId)]);
  const issue=cell(tr,[el('div',r.title,'issue-title'),el('div',r.description,'issue-description')]);
  issue.append(el('small',r.issueType+(r.targetIdpId?' · IDP #'+r.targetIdpId:'')+(r.targetDesignerId?' · Designer #'+r.targetDesignerId:'')));
  const status=el('span',r.status,r.status==='RECTIFIED'?'tag done':'tag');
  const statusCell=cell(tr,[status]);
  if(r.rectifiedAt) statusCell.append(el('div','Rectified: '+timestamp(r.rectifiedAt)));
  const action=cell(tr,[]);
  const button=el('button',r.status==='OPEN'?'Mark rectified':'Resolved');button.disabled=r.status!=='OPEN';
  button.addEventListener('click',async()=>{
    if(!confirm('Mark report #'+r.id+' as rectified?'))return;
    button.disabled=true;
    try{await FeatureClient.request('/api/admin/reports/'+r.id+'/rectify','PATCH',account.csrfToken);await load();}
    catch(err){message.textContent=err.message;button.disabled=false;}
  });action.append(button);rows.append(tr);
}
async function load(){
  if(!account)return;
  message.textContent='Loading reports…';
  try{
    const status=document.getElementById('status').value;
    const data=await FeatureClient.request('/api/admin/reports?status='+status+'&page='+page+'&size=10');
    rows.replaceChildren();data.items.forEach(showReport);
    totalPages=data.totalPages;
    count.textContent=data.totalElements+' report(s)';
    pageLabel.textContent='Page '+(data.totalPages?data.page+1:0)+' of '+totalPages;
    document.getElementById('previous').disabled=page<=0;
    document.getElementById('next').disabled=page+1>=totalPages;
    message.textContent=data.items.length?'':'No reports found for this filter.';
  }catch(e){message.textContent=e.message;}
}
document.getElementById('status').addEventListener('change',()=>{page=0;load();});
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('previous').addEventListener('click',()=>{if(page>0){page--;load();}});
document.getElementById('next').addEventListener('click',()=>{if(page+1<totalPages){page++;load();}});
(async()=>{
  try{account=await FeatureClient.session();
    if(!account){message.replaceChildren(el('span','Please sign in as a User Admin. '));
      const link=el('a','Sign in');link.href=FeatureClient.loginUrl('admin-reports.html');message.append(link);return;}
    if(account.role!=='USER_ADMIN'){message.textContent='Access denied: USER_ADMIN role required.';return;}
    await load();
  }catch(e){message.textContent=e.message;}
})();
</script></body></html>
